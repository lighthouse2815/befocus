name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  backend:
    name: Backend test and package
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: befocus_test
          POSTGRES_USER: befocus
          POSTGRES_PASSWORD: befocus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U befocus -d befocus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DB_URL: jdbc:postgresql://localhost:5432/befocus_test
      DB_USERNAME: befocus
      DB_PASSWORD: befocus_test
      JWT_SECRET: ci-only-befocus-secret-at-least-thirty-two-bytes
      JWT_ACCESS_TTL_SECONDS: 1800
      JWT_REFRESH_TTL_SECONDS: 1209600
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      SEED_ENABLED: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Make Maven wrapper executable
        run: chmod +x backend/mvnw
      - name: Test and package
        working-directory: backend
        run: ./mvnw --batch-mode --no-transfer-progress verify

  mobile:
    name: Mobile typecheck, test, doctor, export
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run expo:doctor
      - name: Export Android Hermes bundle without an emulator
        run: npm run export:android

  compose:
    name: Docker Compose and E2E
    needs: [frontend, backend, mobile]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      JWT_SECRET: ci-only-befocus-secret-at-least-thirty-two-bytes
      SEED_ENABLED: false
      E2E_BASE_URL: http://127.0.0.1:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Validate Compose model
        run: docker compose config --quiet
      - name: Build and start the stack
        run: docker compose up --build --detach --wait --wait-timeout 240
      - name: Verify health endpoints
        run: node scripts/wait-for-url.mjs http://127.0.0.1:8080/actuator/health http://127.0.0.1:5173/health
      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci
      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: Run Playwright flows
        working-directory: e2e
        run: npm test
      - name: Capture Compose logs
        if: always()
        run: docker compose logs --no-color > compose.log
      - name: Upload E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostics
          path: |
            compose.log
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes --remove-orphans
