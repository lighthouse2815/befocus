spring:
  application:
    name: BeFocus
  datasource:
    url: jdbc:postgresql://localhost:5432/befocus
    username: ${DB_USERNAME:${POSTGRES_USER:befocus}}
    password: ${DB_PASSWORD:${POSTGRES_PASSWORD:befocus_dev}}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 1
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_batch_fetch_size: 50
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
  web:
    resources:
      add-mappings: false

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  paths-to-match: /api/v1/**

app:
  jwt:
    secret: ${JWT_SECRET:befocus-local-development-secret-change-this-before-production-2026}
    access-ttl-seconds: ${JWT_ACCESS_TTL_SECONDS:1800}
    refresh-ttl-seconds: ${JWT_REFRESH_TTL_SECONDS:1209600}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:${FRONTEND_ORIGIN:http://localhost:5173}}
  seed:
    enabled: ${SEED_ENABLED:false}

logging:
  level:
    org.springframework.security: INFO
