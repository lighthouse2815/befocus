spring:
  datasource:
    url: jdbc:h2:mem:befocus;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

app:
  jwt:
    secret: test-secret-that-is-long-enough-for-hmac-sha-256-signatures
    access-ttl-seconds: 1800
    refresh-ttl-seconds: 1209600
  cors:
    allowed-origins: http://localhost:5173
  seed:
    enabled: false
